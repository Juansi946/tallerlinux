---
- name: Install and configure MariaDB on Ubuntu
  hosts: ubuntu01
  become: true

  vars_files:
    - ../vars/database.yaml

  tasks:

    - name: Install MariaDB Server
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        update_cache: true

    - name: Install PyMySQL dependency
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    - name: Bind MariaDB to any interface
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MariaDB

    - name: Start and enable MariaDB
      ansible.posix.systemd_service:
        name: mariadb
        state: started
        enabled: true

    - name: Copy database script
      ansible.builtin.copy:
        src: ../files/database.sql
        dest: /tmp/database.sql
        owner: root
        group: root
        mode: '0644'

    - name: Import database
      community.mysql.mysql_db:
        state: import
        name: all
        target: /tmp/database.sql

    - name: Create application database user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_dbase }}.*:ALL"
        host: "%"
        state: present

    - name: Allow MariaDB only from CentOS server
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "3306"
        src: "{{ hostvars[groups['centos'][0]].ansible_host }}"

  handlers:

    - name: Restart MariaDB
      ansible.posix.systemd_service:
        name: mariadb
        state: restarted
