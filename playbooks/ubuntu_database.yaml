---
- name: Install and configure MariaDB on Ubuntu
  hosts: ubuntu01
  become: true

  vars_files:
    - ../vars/database.yaml

  tasks:

    - name: Install MariaDB Server
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        update_cache: true

    - name: Install PyMySQL dependency
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    - name: Bind MariaDB to any interface
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MariaDB

    - name: Start and enable MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    - name: Copy database script
      ansible.builtin.copy:
        src: ../files/cumpleanios.sql
        dest: /tmp/cumpleanios.sql
        owner: root
        group: root
        mode: '0644'

    - name: Check if database exists
      ansible.mysql.mysql_info:
        login_unix_socket: /run/mysqld/mysqld.sock
        filter:
          - databases
      register: mysql_info

    - name: Import database
      ansible.mysql.mysql_db:
        state: import
        name: all
        target: /tmp/cumpleanios.sql
        login_unix_socket: /run/mysqld/mysqld.sock
      when: "'cumples' not in mysql_info.databases"

    - name: Create application database user
      ansible.mysql.mysql_user:
        name: "{{ DB_USER }}"
        password: "{{ DB_PASS }}"
        priv: "{{ DB_DBASE }}.*:ALL"
        host: "%"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create admin database user
      ansible.mysql.mysql_user:
        name: "{{ DB_ADMIN }}"
        password: "{{ DB_ADMIN_PASS }}"
        priv: "{{ DB_DBASE }}.*:ALL"
        host: "%"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
                    
    - name: Allow MariaDB only from CentOS servers
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "3306"
        src: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['centos'] }}"

  handlers:

    - name: Restart MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted

